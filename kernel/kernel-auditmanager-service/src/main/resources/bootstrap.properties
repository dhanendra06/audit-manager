#spring.cloud.config.uri=localhost
#spring.cloud.config.label=master
spring.profiles.active=dev
spring.cloud.config.name=kernel
spring.application.name=kernel-auditmanager-service
#management.security.enabled=false
#management.endpoint.health.show-details=when-authorized
#management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh,mappings,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true


server.port=8081
server.servlet.path=/v1/auditmanager

# Java 21 virtual threads — each request gets a lightweight virtual thread,
# so synchronous DB writes never block platform threads under high concurrency
spring.threads.virtual.enabled=true
spring.main.allow-bean-definition-overriding=true


spring.datasource.url=${audit_database_url}
spring.datasource.username=${audit_database_username}
spring.datasource.password=${audit_database_password}

# HikariCP connection pool — tune these per environment via config server
spring.datasource.hikari.maximum-pool-size=${audit_db_pool_max:20}
spring.datasource.hikari.minimum-idle=${audit_db_pool_min:5}
spring.datasource.hikari.connection-timeout=${audit_db_connection_timeout_ms:10000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

#disabling health check so that client doesnt try to load properties from sprint config server every
# 5 minutes (should not be done in production)
health.config.enabled=false

openapi.info.title=Audit Manager Service
openapi.info.description=Rest Endpoints for operations related to audit
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
mosipbox.public.url=http://localhost:${server.port}
openapi.service.servers[0].url=${mosipbox.public.url}${server.servlet.path}
openapi.service.servers[0].description=Audit Manager Service
springdoc.swagger-ui.disable-swagger-default-url=true
spring.mvc.servlet.path=${server.servlet.path}
